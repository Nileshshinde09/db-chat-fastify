version: "3.8"

services:
  ferretdb:
  image: debian:bookworm-slim
  container_name: ferretdb
  restart: always
  environment:
    FERRETDB_RELEASE: ${FERRETDB_RELEASE:-latest/download}
  volumes:
    - ferretdb_data:/data
  ports:
    - "27017:27017"

  fastify-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: "mongodb://ferretdb:27017/fastify_server_test_db"
    depends_on:
      - ferretdb

volumes:
  ferretdb_data: