info:
  name: "Admin cannot disable the owner"
  type: http
  seq: 9
  tags:
    - regression

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/auth/users/{{ownerAId}}/status"
  body:
    type: json
    data: |-
      {
        "status": "disabled"
      }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "403"

settings:
  encodeUrl: true
