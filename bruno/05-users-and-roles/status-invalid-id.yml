info:
  name: "Malformed user id is rejected"
  type: http
  seq: 15
  tags:
    - regression

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/auth/users/123/status"
  body:
    type: json
    data: |-
      {
        "status": "disabled"
      }
  auth:
    type: bearer
    token: "{{ownerAToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
