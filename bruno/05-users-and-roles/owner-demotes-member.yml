info:
  name: "Owner demotes them back to member"
  type: http
  seq: 6
  tags:
    - regression

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/auth/users/{{memberId}}/role"
  body:
    type: json
    data: |-
      {
        "role": "member"
      }
  auth:
    type: bearer
    token: "{{ownerAToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("role is back to member", function () {
          expect(res.body.user.role).to.equal('member');
        });

settings:
  encodeUrl: true
