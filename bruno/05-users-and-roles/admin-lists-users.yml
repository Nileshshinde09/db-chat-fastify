info:
  name: "Admin can list users"
  type: http
  seq: 2
  tags:
    - regression

http:
  method: GET
  url: "{{baseUrl}}/api/v1/auth/users"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
