info:
  name: "Cannot assign the owner role"
  type: http
  seq: 8
  tags:
    - regression

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/auth/users/{{memberId}}/role"
  body:
    type: json
    data: |-
      {
        "role": "owner"
      }
  auth:
    type: bearer
    token: "{{ownerAToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
  scripts:
    - type: tests
      code: |-
        test("returns VALIDATION_ERROR", function () {
          expect(res.body.code).to.equal('VALIDATION_ERROR');
        });

settings:
  encodeUrl: true
