info:
  name: "Owner invites a member"
  type: http
  seq: 2
  tags:
    - regression

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/invites"
  body:
    type: json
    data: |-
      {
        "email": "{{memberEmail}}",
        "role": "member"
      }
  auth:
    type: bearer
    token: "{{ownerAToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  scripts:
    - type: after-response
      code: |-
        const m = /token=([^&]+)/.exec(res.body.inviteLink || '');
        bru.setVar('memberInviteToken', m ? m[1] : '');
    - type: tests
      code: |-
        test("creates a pending member invite", function () {
          expect(res.body.invite.role).to.equal('member');
        });

settings:
  encodeUrl: true
