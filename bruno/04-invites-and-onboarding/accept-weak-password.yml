info:
  name: "Accept validates the password policy"
  type: http
  seq: 11
  tags:
    - regression

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/invites/accept"
  body:
    type: json
    data: |-
      {
        "token": "{{memberInviteToken}}",
        "name": "Mia Member",
        "password": "short"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
  scripts:
    - type: tests
      code: |-
        test("flags the password field", function () {
          expect(res.body.issues.map((i) => i.path)).to.include('password');
        });

settings:
  encodeUrl: true
