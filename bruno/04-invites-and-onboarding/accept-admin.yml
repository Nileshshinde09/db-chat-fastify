info:
  name: "Admin accepts the invite and is logged in"
  type: http
  seq: 8
  tags:
    - smoke
    - regression

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/invites/accept"
  body:
    type: json
    data: |-
      {
        "token": "{{adminInviteToken}}",
        "name": "Adam Admin",
        "password": "{{testPassword}}"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  scripts:
    - type: after-response
      code: |-
        bru.setVar('adminToken', res.body.accessToken);
        bru.setVar('adminId', res.body.user.id);
    - type: tests
      code: |-
        test("joins organization A with the invited role", function () {
          expect(res.body.user.role).to.equal('admin');
          expect(res.body.user.orgId).to.equal(bru.getVar('orgAId'));
          expect(res.body.organization.id).to.equal(bru.getVar('orgAId'));
          expect(res.body.user.email).to.equal(bru.getVar('adminEmail'));
        });

settings:
  encodeUrl: true
