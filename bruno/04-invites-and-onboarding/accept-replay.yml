info:
  name: "An invite can only be used once"
  type: http
  seq: 10
  tags:
    - regression

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/invites/accept"
  body:
    type: json
    data: |-
      {
        "token": "{{adminInviteToken}}",
        "name": "Replay Attacker",
        "password": "{{testPassword}}"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
  scripts:
    - type: tests
      code: |-
        test("returns INVALID_INVITE", function () {
          expect(res.body.code).to.equal('INVALID_INVITE');
        });

settings:
  encodeUrl: true
