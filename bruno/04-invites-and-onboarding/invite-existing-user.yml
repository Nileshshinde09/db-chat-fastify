info:
  name: "Cannot invite an email that already has an account"
  type: http
  seq: 5
  tags:
    - regression

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/invites"
  body:
    type: json
    data: |-
      {
        "email": "{{ownerAEmail}}",
        "role": "member"
      }
  auth:
    type: bearer
    token: "{{ownerAToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"
  scripts:
    - type: tests
      code: |-
        test("returns EMAIL_TAKEN", function () {
          expect(res.body.code).to.equal('EMAIL_TAKEN');
        });

settings:
  encodeUrl: true
