info:
  name: "Org B cannot see org A's pending invites"
  type: http
  seq: 3
  tags:
    - regression

http:
  method: GET
  url: "{{baseUrl}}/api/v1/auth/invites"
  auth:
    type: bearer
    token: "{{ownerBToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("sees no invites", function () {
          expect(res.body.invites).to.have.length(0);
        });

settings:
  encodeUrl: true
