info:
  name: "The org A invite is still pending"
  type: http
  seq: 8
  tags:
    - regression

http:
  method: GET
  url: "{{baseUrl}}/api/v1/auth/invites"
  auth:
    type: bearer
    token: "{{ownerAToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("isolation invite still exists", function () {
          expect(res.body.invites.map((i) => i.id)).to.include(bru.getVar('isolationInviteId'));
        });

settings:
  encodeUrl: true
