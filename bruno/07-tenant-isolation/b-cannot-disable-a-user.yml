info:
  name: "Org B cannot disable an org A user"
  type: http
  seq: 4
  tags:
    - regression

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/auth/users/{{memberId}}/status"
  body:
    type: json
    data: |-
      {
        "status": "disabled"
      }
  auth:
    type: bearer
    token: "{{ownerBToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
  scripts:
    - type: tests
      code: |-
        test("looks like the user does not exist", function () {
          expect(res.body.code).to.equal('NOT_FOUND');
        });

settings:
  encodeUrl: true
