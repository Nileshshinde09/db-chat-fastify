info:
  name: "Weak password is rejected"
  type: http
  seq: 5
  tags:
    - regression

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/register-organization"
  body:
    type: json
    data: |-
      {
        "organizationName": "Weak Org {{runId}}",
        "name": "Weak",
        "email": "weak-{{runId}}@acme-test.com",
        "password": "short"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
  scripts:
    - type: tests
      code: |-
        test("flags the password field", function () {
          expect(res.body.issues.map((i) => i.path)).to.include('password');
        });

settings:
  encodeUrl: true
