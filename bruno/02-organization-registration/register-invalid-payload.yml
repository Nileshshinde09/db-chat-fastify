info:
  name: "Invalid payload returns a validation error"
  type: http
  seq: 4
  tags:
    - regression

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/register-organization"
  body:
    type: json
    data: |-
      {
        "organizationName": "x",
        "email": "not-an-email",
        "password": "123"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
  scripts:
    - type: tests
      code: |-
        test("returns VALIDATION_ERROR with issue paths", function () {
          expect(res.body.code).to.equal('VALIDATION_ERROR');
          const paths = res.body.issues.map((i) => i.path);
          expect(paths).to.include.members(['organizationName', 'name', 'email', 'password']);
        });

settings:
  encodeUrl: true
