info:
  name: "Replaying the old refresh token is detected as theft"
  type: http
  seq: 3
  tags:
    - regression

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/refresh"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
  scripts:
    - type: before-request
      code: |-
        req.setHeader('Cookie', 'refresh_token=' + bru.getVar('refreshR1'));
    - type: tests
      code: |-
        test("returns TOKEN_REUSED", function () {
          expect(res.body.code).to.equal('TOKEN_REUSED');
        });

settings:
  encodeUrl: true
