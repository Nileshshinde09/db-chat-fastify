info:
  name: "Logout revokes the refresh token"
  type: http
  seq: 7
  tags:
    - regression

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/logout"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"
  scripts:
    - type: before-request
      code: |-
        req.setHeader('Cookie', 'refresh_token=' + bru.getVar('refreshR3'));
    - type: tests
      code: |-
        test("clears the cookie", function () {
          const raw = res.getHeader('set-cookie') || res.headers['set-cookie'];
          const joined = Array.isArray(raw) ? raw.join(';') : String(raw || '');
          expect(joined).to.contain('refresh_token=;');
        });

settings:
  encodeUrl: true
