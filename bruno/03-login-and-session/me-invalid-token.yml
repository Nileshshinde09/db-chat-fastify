info:
  name: "Protected route with a garbage token"
  type: http
  seq: 7
  tags:
    - regression

http:
  method: GET
  url: "{{baseUrl}}/api/v1/auth/me"
  auth:
    type: bearer
    token: "not.a.real-token"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
  scripts:
    - type: tests
      code: |-
        test("returns UNAUTHORIZED", function () {
          expect(res.body.code).to.equal('UNAUTHORIZED');
        });

settings:
  encodeUrl: true
