info:
  name: "Get current user"
  type: http
  seq: 5
  tags:
    - smoke
    - regression

http:
  method: GET
  url: "{{baseUrl}}/api/v1/auth/me"
  auth:
    type: bearer
    token: "{{ownerAToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("returns the logged-in user and their organization", function () {
          expect(res.body.user.email).to.equal(bru.getVar('ownerAEmail'));
          expect(res.body.user.orgId).to.equal(bru.getVar('orgAId'));
          expect(res.body.organization.id).to.equal(bru.getVar('orgAId'));
        });

settings:
  encodeUrl: true
