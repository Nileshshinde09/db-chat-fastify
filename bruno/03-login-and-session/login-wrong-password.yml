info:
  name: "Wrong password gives a generic 401"
  type: http
  seq: 2
  tags:
    - regression

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{ownerAEmail}}",
        "password": "definitely-the-wrong-password"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
  scripts:
    - type: after-response
      code: |-
        bru.setVar('wrongPasswordMessage', res.body.message);
    - type: tests
      code: |-
        test("returns INVALID_CREDENTIALS", function () {
          expect(res.body.code).to.equal('INVALID_CREDENTIALS');
        });

settings:
  encodeUrl: true
