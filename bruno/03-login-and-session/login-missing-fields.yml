info:
  name: "Missing fields return a validation error"
  type: http
  seq: 4
  tags:
    - regression

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/login"
  body:
    type: json
    data: |-
      {}

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
  scripts:
    - type: tests
      code: |-
        test("returns VALIDATION_ERROR", function () {
          expect(res.body.code).to.equal('VALIDATION_ERROR');
        });

settings:
  encodeUrl: true
