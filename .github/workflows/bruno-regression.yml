name: Bruno Regression Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start FerretDB (SQLite) + Server stack
        run: |
          docker compose -f docker-compose.bruno.yml up -d --build
          echo "Waiting for server to be healthy..."
          timeout 90 bash -c '
            until [ "$(docker inspect --format="{{.State.Health.Status}}" \
              $(docker compose -f docker-compose.bruno.yml ps -q your-server))" = "healthy" ]; do
              sleep 3
            done
          '

      - name: Verify FerretDB connectivity
        run: |
          docker compose -f docker-compose.bruno.yml exec -T ferretdb \
            sqlite3 /data/yourdb.sqlite ".tables" || echo "Database file will be created on first write"

      - name: Run Bruno CLI Regression Tests
        uses: usebruno/bruno-cli-action@v1
        with:
          working-directory: ./bruno-collection
          command: 'run --env ci --reporter-junit results.xml --reporter-html report.html'

      - name: Upload Bruno Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bruno-reports-${{ github.run_id }}
          path: |
            ./bruno-collection/results.xml
            ./bruno-collection/report.html

      - name: Tear Down Resources
        if: always()
        run: |
          docker compose -f docker-compose.bruno.yml down -v --remove-orphans