services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./server                    # 👈 was ./backend
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@postgres:5432/app

  # frontend:
  #   build: ./frontend                  # 👈 was ./web
  #   depends_on: [server]
  #   ports: ["3000:3000"]
  #   environment:
  #     APPLICATION_BACKEND_URL: http://server:8000    # 👈 was backend

  # test-only, opt-in
  bruno:
    image: node:20-alpine
    profiles: ["test"]
    working_dir: /bruno
    volumes:
      - ./bruno:/bruno
      - ./bruno/results:/bruno/results
    environment:
      EMAIL: ${TEST_EMAIL}
      PASSWORD: ${TEST_PASSWORD}
    depends_on:
      server:   { condition: service_started }       # 👈 was backend
      # frontend: { condition: service_started }       # 👈 was web
    entrypoint: ["/bin/sh", "-c"]
    command: >
      npm install -g @usebruno/cli --silent &&
      bru run --env Docker --recursive
        --env-var email=$${EMAIL}
        --env-var password=$${PASSWORD}
        --reporter-junit results/junit.xml

volumes:
  pgdata: